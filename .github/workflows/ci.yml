name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Run by the release workflow before it builds the installers
  workflow_call:
    inputs:
      skip_installers:
        description: Do not build the installers of the current architecture of each OS
        type: boolean
        default: false

jobs:
  check:
    name: Lint, typecheck and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  e2e:
    name: End-to-end test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: xvfb-run -a npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/

  package:
    name: Build installers (${{ matrix.os }})
    needs: check
    # The release workflow builds them for every architecture itself. On push and
    # pull_request there are no inputs and inputs.skip_installers is null, which is
    # falsy (whereas null != false is false, since null and false compare as 0)
    if: ${{ !inputs.skip_installers }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The runners have dpkg and fakeroot for the deb package but not rpmbuild for the rpm
      # package or mksquashfs for the AppImage
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm squashfs-tools
      - run: npm run make
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: out/make/
          retention-days: 7
