name: Release

# Pushing a branch named release/<version>, for example release/1.2.0 or
# release/1.2.0-beta.1, builds the installers of every platform, tags the commit
# v<version> and publishes them in a GitHub release.
on:
  push:
    branches: ['release/*.*.*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Read the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - id: version
        name: Read the version from the branch name
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          version="${BRANCH#release/}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Branch $BRANCH is not release/<major>.<minor>.<patch>[-<pre-release>]"
            exit 1
          fi
          prerelease=false
          if [[ "$version" == *-* ]]; then
            prerelease=true
          fi
          {
            echo "version=$version"
            echo "tag=v$version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
      - name: Check that the version was not released from another commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # A re-run on the same commit is allowed and replaces the files of the release
          if sha=$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha 2>/dev/null) && [[ "$sha" != "$GITHUB_SHA" ]]; then
            echo "::error::$TAG was already released from $sha. Push a branch for a new version instead."
            exit 1
          fi

  check:
    name: Check
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      skip_installers: true

  make:
    name: Make (${{ matrix.platform }} ${{ matrix.arch }})
    needs: [prepare, check]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Architectures other than the one of the runner are cross-built.
          # npm_arch selects the git that dugite downloads. Electron 44 and
          # later no longer publish Linux armv7l and Windows ia32 builds.
          - { os: ubuntu-latest, platform: linux, arch: x64, npm_arch: x64 }
          - { os: ubuntu-latest, platform: linux, arch: arm64, npm_arch: arm64 }
          - { os: windows-latest, platform: win32, arch: x64, npm_arch: x64 }
          - { os: windows-latest, platform: win32, arch: arm64, npm_arch: arm64 }
          - { os: macos-latest, platform: darwin, arch: arm64, npm_arch: arm64 }
          - { os: macos-latest, platform: darwin, arch: x64, npm_arch: x64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install rpmbuild and mksquashfs
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y rpm squashfs-tools
      # Installed for the runner, since the dmg maker loads native modules at build time
      - run: npm ci
      - name: Download the git of the target architecture
        run: node node_modules/dugite/script/download-git.js
        env:
          npm_config_arch: ${{ matrix.npm_arch }}
      - name: Set the version
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version
      - run: npm run make -- --arch=${{ matrix.arch }}
      - name: Collect the packages
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir release
          find out/make -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.dmg' -o -name '*.AppImage' \) -exec cp {} release/ \;
          # The zip is the app ready to run, without installation
          find out/make -type f -name '*.zip' -exec cp {} "release/Gitadmin-$VERSION-$PLATFORM-$ARCH-portable.zip" \;
          # The Squirrel installer has the same name for every architecture
          find out/make -type f -name '*Setup.exe' -exec cp {} "release/Gitadmin-$VERSION-win32-$ARCH-Setup.exe" \;
          ls -l release
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.platform }}-${{ matrix.arch }}
          path: release/
          if-no-files-found: error

  release:
    name: Publish ${{ needs.prepare.outputs.tag }}
    needs: [prepare, make]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: packages-*
          path: release
          merge-multiple: true
      - name: Tag the commit and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          ls -l release
          notes=$(cat <<'EOF'
          ## Downloads

          **Without installation**
          - Windows: `*-win32-x64-portable.zip` or `*-win32-arm64-portable.zip`, unzip and run `gitadmin.exe`
          - macOS: `*-darwin-arm64-portable.zip` for Apple Silicon or `*-darwin-x64-portable.zip` for Intel, unzip and open `Gitadmin.app`
          - Linux: `*.AppImage`, make it executable with `chmod +x` and run it, or `*-linux-*-portable.zip`, unzip and run `gitadmin`

          **Installers**
          - Windows: `*-Setup.exe`
          - macOS: `*.dmg`
          - Linux: `*.deb` for Debian and Ubuntu, `*.rpm` for Fedora and openSUSE
          EOF
          )
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* \
              --target "$GITHUB_SHA" \
              --title "Gitadmin $TAG" \
              --notes "$notes" \
              --generate-notes \
              --prerelease="$PRERELEASE"
          fi
